        <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>视频播放器</title>
    <!-- 没有任何样式，完全无布局干扰，纯基础功能 -->
</head>
<body>
    <!-- 输入框：用于输入文件名 -->
    <input type="text" id="videoInput" placeholder="输入文件名（不含扩展名）">
    <!-- 按钮：点击后构造URL并访问 -->
    <button onclick="playVideo()">播放</button>

    <script>
        // 兼容性最好的方式：直接使用顶层函数，无任何现代语法
        function playVideo() {
            // 获取输入框元素
            var inputElement = document.getElementById('videoInput');
            // 获取用户输入的内容，并去除首尾空格
            var fileName = inputElement.value.trim();
            
            // 检查是否为空输入
            if (fileName === '') {
                alert('请输入文件名');
                return;
            }

            // 构建目标URL
            var baseUrl = 'https://cdn.sinacloud.net/edge.v.iask.com/';
            var fullUrl = baseUrl + fileName + '.hlv';

            // 使用最兼容的方式打开URL：直接修改window.location.href
            // 这种方式在所有浏览器中均有效，且无样式干扰
            window.location.href = fullUrl;
        }
    </script>
</body>
</html>
